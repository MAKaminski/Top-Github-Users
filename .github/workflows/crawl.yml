name: crawl

# Tiered because places move at wildly different speeds and cost wildly
# different amounts of rate limit. The worldwide board and the largest countries
# earn a daily pass; the long tail of countries a weekly sweep, split into
# alphabetical shards so one failing range does not lose the others; cities a
# monthly one; organisations and repositories weekly.
#
# `github.event.schedule` is how one workflow tells its own crons apart — the
# alternative is four near-identical files that drift out of step.

on:
  schedule:
    # Off the hour: everything else in the world is scheduled on it, and GitHub
    # queues scheduled runs accordingly.
    - cron: "5 */6 * * *" # 6-hourly — GH Archive discovery (no API budget)
    - cron: "17 3 * * *" # daily   — hydrate the discovered corpus, then calendars
    - cron: "43 4 * * 0" # weekly  — remaining countries, organisations, repositories
    - cron: "11 5 1 * *" # monthly — cities
  workflow_dispatch:
    inputs:
      tier:
        description: Tier to run
        type: choice
        default: hydrate
        options: [verify, discover, hydrate, calendars, supplement, countries, cities, orgs, repos]
      shard:
        description: "Shard, as N/M — countries and cities only"
        type: string
        default: ""
      limit:
        description: Maximum places to crawl in this run
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Fails the workflow before anything writes. The crawler aborts on a missing
  # token too, but by then a matrix leg has already spent five minutes on
  # checkout and install — and a red job named for the reason is easier to act
  # on than a stack trace in step six.
  token:
    name: crawl token present
    runs-on: ubuntu-latest
    steps:
      - name: Require GH_CRAWL_TOKEN
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: |
          if [ -z "$GH_CRAWL_TOKEN" ]; then
            echo "::error::GH_CRAWL_TOKEN is not set. Add a repository secret holding a GitHub" \
                 "token with public read access. Refusing to run: an unauthenticated crawl" \
                 "cannot reach the API and would commit an empty snapshot over good data."
            exit 1
          fi

  # Discovery reads GH Archive, which is public object storage — no token, and
  # therefore deliberately NOT gated on the `token` job. It can run even when the
  # crawl secret is missing, which is exactly when knowing the candidate set is
  # most useful.
  discover:
    if: github.event.schedule == '5 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'discover')
    name: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Discover candidates from GH Archive
        run: pnpm crawl --tier=discover ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
      - name: Commit
        run: .github/scripts/commit-data.sh discover

  # The main pass. Reads the candidate list discovery already wrote and turns it
  # into every board, at 100 aliases a GraphQL query. Scalars only: the
  # day-by-day calendar is 371 nodes per login and belongs to the job below.
  hydrate:
    needs: token
    if: github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'hydrate')
    name: hydrate (scalars, whole corpus)
    runs-on: ubuntu-latest
    # Well inside the 6-hour job ceiling: the printed budget refuses anything
    # that cannot finish, so a timeout here means the estimate was wrong, which
    # is worth failing loudly for.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One GraphQL point, spent first. Discovery reads 3.5 GB of GH Archive
      # before hydration touches the API, so without this a rejected token
      # surfaces four minutes and a full discovery pass into the job.
      - name: Verify the token is accepted
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=verify
      # candidates.json is gitignored — it is regenerated in seconds and is an
      # intermediate, not a snapshot — so this job produces its own.
      - name: Discover candidates from GH Archive
        run: pnpm crawl --tier=discover
      - name: Hydrate
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=hydrate ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
      - name: Commit
        run: .github/scripts/commit-data.sh hydrate

  # The expensive selection, bought only for the depth that has a profile page.
  # Runs after hydration because it reads the board hydration just wrote.
  calendars:
    needs: [token, hydrate]
    if: github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'calendars')
    name: calendars (measured, profile depth)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One GraphQL point, spent first. Discovery reads 3.5 GB of GH Archive
      # before hydration touches the API, so without this a rejected token
      # surfaces four minutes and a full discovery pass into the job.
      - name: Verify the token is accepted
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=verify
      - name: Fetch calendars
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=calendars ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
      - name: Commit
        run: .github/scripts/commit-data.sh calendars

  # The supplementary search pass. GH Archive only records *public* activity, so
  # a developer working almost entirely in private repositories never appears in
  # it; this is the pass that finds them. Weekly, not daily — it is capped at
  # 1,000 results per query and costs search budget that hydration does not.
  supplement:
    needs: token
    if: github.event.schedule == '43 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'supplement')
    name: supplement (search for mostly-private accounts)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=supplement
      - name: Commit
        run: .github/scripts/commit-data.sh supplement

  # Moved off the daily cron when hydration started deriving country boards by
  # grouping the hydrated set. Running both on the same day would have the
  # shallow search-derived board (150 rows, capped by the search API) overwrite
  # the derived one (up to 25,000) a few minutes later.
  countries_daily:
    needs: token
    if: github.event.schedule == '43 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'countries' && inputs.shard == '')
    name: countries (supplementary search, head of list)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No shard means the head of the country registry — the forty largest
      # developer populations. See countryTargets() in scripts/crawler/index.ts.
      - name: Crawl
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=countries ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
      - name: Commit
        run: .github/scripts/commit-data.sh countries-daily

  countries_weekly:
    needs: token
    if: github.event.schedule == '43 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'countries' && inputs.shard != '')
    name: countries ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # One token means one 30-per-minute search budget. Legs running in
      # parallel would spend the same allowance several times over and earn a
      # secondary-rate-limit block; sharding here buys independent failure and
      # independent commits, not concurrency.
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=countries --shard=${{ matrix.shard }}
      - name: Commit
        run: .github/scripts/commit-data.sh "countries ${{ matrix.shard }}"

  cities:
    needs: token
    if: github.event.schedule == '11 5 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'cities')
    name: cities ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=cities --shard=${{ matrix.shard }}
      - name: Commit
        run: .github/scripts/commit-data.sh "cities ${{ matrix.shard }}"

  # Organisations are aggregated from the country boards on disk, so this has to
  # follow the weekly sweep rather than run beside it. `always()` keeps the job
  # reachable on a manual dispatch, where the sweep is skipped entirely.
  orgs_repos:
    needs: [token, countries_weekly]
    if: |
      always() && needs.token.result == 'success' && needs.countries_weekly.result != 'failure' &&
      (github.event.schedule == '43 4 * * 0' ||
       (github.event_name == 'workflow_dispatch' && (inputs.tier == 'orgs' || inputs.tier == 'repos')))
    name: organisations and repositories
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl organisations
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=orgs
      - name: Crawl repositories
        env:
          GH_CRAWL_TOKEN: ${{ secrets.GH_CRAWL_TOKEN }}
        run: pnpm crawl --tier=repos
      - name: Commit
        run: .github/scripts/commit-data.sh orgs-repos
